<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pay Parent 测试页</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f7fb; margin: 0; padding: 32px; }
        .container { max-width: 900px; margin: 0 auto; background: white; border-radius: 12px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        select, input, button { padding: 10px 12px; border-radius: 8px; border: 1px solid #dfe7f1; margin: 8px 0; }
        button { background: #2563eb; color: white; border: none; cursor: pointer; }
        .row { display: flex; gap: 12px; flex-wrap: wrap; }
        .result { margin-top: 20px; padding: 16px; background: #0f172a; color: #e2e8f0; border-radius: 8px; white-space: pre-wrap; }
    </style>
</head>
<body>
<div class="container">
    <h2>聚合支付测试页面</h2>
    <div class="row">
        <label>支付渠道</label>
        <select id="channel">
            <option value="WECHAT">微信支付</option>
            <option value="ALIPAY">支付宝</option>
            <option value="PAYPAL">PayPal</option>
            <option value="APPLE_PAY">Apple Pay</option>
            <option value="TONGLIAN">通联支付</option>
            <option value="LAKALA">拉卡拉</option>
        </select>
    </div>
    <div class="row">
        <label>订单号</label>
        <input id="orderNo" value="ORD202609290001" />
    </div>
    <div class="row">
        <label>金额</label>
        <input id="amount" value="99.90" />
    </div>
    <div class="row">
        <label>商品名</label>
        <input id="subject" value="测试商品" />
    </div>
    <div class="row">
        <button id="submitBtn">发起支付</button>
    </div>
    <div class="result" id="resultBox">等待请求...</div>
</div>

<script src="/js/paymentTest.js"></script>
</body>
</html>
